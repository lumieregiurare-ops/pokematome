<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>その他のニュース｜ポケモン速報</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fffbea'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23fff'/%3E%3Cpath d='M 16 50 A 34 34 0 0 1 84 50 Z' fill='%23e03131'/%3E%3Crect x='16' y='46.6' width='68' height='6.8' fill='%2324272e'/%3E%3Ccircle cx='50' cy='50' r='21.08' fill='%23fff' stroke='%2324272e' stroke-width='4.08'/%3E%3Ccircle cx='50' cy='50' r='9.52' fill='%23e03131'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <h1 class="logo">
        <a href="./">
          <span class="logo-mark" aria-hidden="true"><span class="lens"></span><span class="lamp"></span><span class="lamp y"></span><span class="lamp g"></span></span>
          <span class="logo-text">ポケモン<span class="logo-accent">速報</span></span>
        </a>
      </h1>
      <p class="tagline">その他のニュース</p>
      <div class="header-tools">
        <a class="fav-link" href="./#favorites">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.5L22 9.6l-5.2 4.8 1.4 7.6L12 18.1l-6.2 3.9 1.4-7.6L2 9.6l7.1-1.1z"/></svg>
          <span>あとで読む</span>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="layout">

      <aside class="side side-left fav-hide"></aside>

      <div class="col-main">
        <div class="other-page">
          <div class="sec-head">
            <div class="sec-head-row">
              <h2 class="sec-title"><span class="ball" aria-hidden="true"></span>その他のニュース</h2>
              <a class="back-btn" href="./">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                トップに戻る
              </a>
            </div>
              </div>
          <div id="otherBody"><div class="loading loading-feed"><span class="spinner" role="status" aria-label="読み込み中"></span><span>読み込んでいます…</span></div></div>
          <nav class="pagination" id="pagination" aria-label="ページ"></nav>
          <p class="empty" id="empty" hidden>記事を読み込めませんでした。</p>
        </div>
      </div>

      <aside class="side side-right">

        <section class="mod mod-gacha">
          <h2 class="mod-head">ニュースガチャ</h2>
          <div id="gachaBody"><div class="loading"><span class="spinner" role="status" aria-label="読み込み中"></span></div></div>
          <button class="mod-btn" id="gachaAgain" type="button">もう一度引く</button>
        </section>

        <section class="mod mod-dex">
          <h2 class="mod-head">きょうの1匹</h2>
          <div id="dexBody"><div class="loading"><span class="spinner" role="status" aria-label="読み込み中"></span></div></div>
          <div class="dex-tools">
            <button class="mod-btn" id="dexAgain" type="button">引き直す</button>
            <label class="toggle toggle-mini"><input type="checkbox" id="dexRare"><span>伝説・幻だけ</span></label>
          </div>
        </section>
      </aside>

    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong>ポケモン速報</strong> は、ポケモン関連のニュースを集めているまとめサイトです。30 分おきに更新しています。</p>
      <p class="contact"><a href="https://docs.google.com/forms/d/e/1FAIpQLSesWyhmZ6sRS_ve-c3X2KqF_wC5PK2TgwgQbTKmnQltSlg5Jw/viewform" target="_blank" rel="noopener noreferrer">お問い合わせはこちら</a></p>
      <p class="copy">© <span id="year"></span> ポケモン速報</p>
    </div>
  </footer>

  <script src="assets/other.js"></script>
</body>
</html>
